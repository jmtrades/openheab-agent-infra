[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openheab-crewai"
version = "0.1.0"
description = "OpenHeab adapter for CrewAI — DID + wallet + email per crew agent."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["openheab>=0.1.0", "crewai>=0.30.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["openheab_crewai*"]
