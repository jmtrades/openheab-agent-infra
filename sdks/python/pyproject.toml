[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openheab"
version = "0.1.0"
description = "OpenHeab substrate client — agent identity, bank (USDC), email, KYC, memory."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Junior Martin" }]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://openheab.com"
Source = "https://github.com/jmtrades/openheab-agent-infra"

[project.scripts]
openheab = "openheab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openheab*"]
